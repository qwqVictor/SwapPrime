name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

# Guest is arm64 (VirtualMacOniPad), so pin the arm64 Apple Silicon image
# (macos-15 is the current stable arm64 label; avoid macos-latest, which
# migrates between macOS versions).
jobs:
  build:
    name: Build SwapPrime.app
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: ./build_swap_prime.sh

      - name: Verify architecture
        run: file SwapPrime.app/Contents/MacOS/SwapPrime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwapPrime-macos-arm64
          path: SwapPrime.app
          if-no-files-found: error

  # Tag push (v*) → build + publish a GitHub Release with the .app zipped.
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SwapPrime-macos-arm64
          path: dist

      - name: Package release zip
        run: |
          cd dist
          mv SwapPrime.app "SwapPrime-${GITHUB_REF_NAME}.app"
          zip -r "SwapPrime-${GITHUB_REF_NAME}-macos-arm64.zip" \
              "SwapPrime-${GITHUB_REF_NAME}.app"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "$GITHUB_REF_NAME" \
              "SwapPrime-${GITHUB_REF_NAME}-macos-arm64.zip" \
              --title "$GITHUB_REF_NAME" --generate-notes
